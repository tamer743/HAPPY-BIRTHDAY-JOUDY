<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Judy | Birthday Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Cairo:wght@400;700&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #7209b7;
            --bg-gradient: linear-gradient(-45deg, #fff0f3, #ffe3ed, #f0e6ff, #e3f2fd);
        }
        
        html { height: auto; scroll-behavior: smooth; }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            margin: 0;
            padding: 20px 0 100px 0;
            min-height: 100vh;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { text-align: center; width: 90%; max-width: 650px; z-index: 10; position: relative; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary-color); font-size: 3.2rem; margin-bottom: 5px; text-shadow: 2px 4px 8px rgba(0,0,0,0.1); }
        .sub-text { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--secondary-color); margin-top: 0; }

        .countdown-container {
            display: flex; justify-content: center; gap: 15px; margin: 30px 0;
            background: rgba(255, 255, 255, 0.5); padding: 20px; border-radius: 30px;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .time-box { text-align: center; }
        .time-val { font-size: 2rem; font-weight: bold; color: var(--primary-color); display: block; }
        .time-label { font-size: 0.8rem; color: var(--secondary-color); text-transform: uppercase; }

        .gift-container { cursor: pointer; margin: 40px 0; transition: all 0.5s ease; }
        .gift-box { font-size: 140px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.2)); }
        
        /* زرار مقفول افتراضياً */
        .open-btn { 
            font-family: 'Dancing Script', cursive; font-size: 2rem; color: white;
            background: #bdbdbd; /* لون رمادي وهو مقفول */
            padding: 10px 35px; border-radius: 50px; margin-top: 25px; display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: all 0.5s ease;
        }

        /* ستايل الزرار لما يفتح */
        .unlocked-btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color)) !important;
            animation: glowPulse 2s infinite;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3) !important;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }
            50% { box-shadow: 0 5px 30px rgba(255, 77, 109, 0.6); }
            100% { box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }
        }

        /* أنيميشن الاهتزاز */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease; }

        #secret-message { 
            display: none; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); 
            text-align: right; line-height: 2.3; direction: rtl; margin-top: 20px;
        }

        .typing-container { color: #444; font-size: 1.35rem; white-space: pre-line; }
        .final-wish { display: none; font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--primary-color); text-align: center; margin-top: 40px; padding: 30px 20px; border-top: 3px dashed #ffccd5; }
        .english-touch { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--primary-color); display: block; text-align: center; margin: 25px 0; direction: ltr; }
        #wish-box { display: none; margin-top: 60px; text-align: center; }
        #wish-input { width: 85%; padding: 18px 25px; border: 2px solid #ffccd5; border-radius: 50px; outline: none; margin-bottom: 25px; font-family: 'Cairo', sans-serif; text-align: center; font-size: 1.2rem; }
        .main-btn { font-family: 'Dancing Script', cursive; background: linear-gradient(45deg, var(--secondary-color), var(--primary-color)); color: white; border: none; padding: 15px 50px; border-radius: 50px; font-size: 1.8rem; cursor: pointer; }
        .particle { position: fixed; pointer-events: none; z-index: 1; top: -10vh; }
    </style>
</head>
<body onclick="startBackgroundMusic()">

    <audio id="bgMusic" loop><source src="background.mp3" type="audio/mpeg"></audio>
    <audio id="mainMusic"><source src="main.mp3" type="audio/mpeg"></audio>

    <div class="container">
        <h1>Happy Birthday, Judy</h1>
        <p class="sub-text" id="status-label">Counting down to the magic...</p>

        <div class="countdown-container" id="countdown">
            <div class="time-box"><span class="time-val" id="days">00</span><span class="time-label">Days</span></div>
            <div class="time-box"><span class="time-val" id="hours">00</span><span class="time-label">Hrs</span></div>
            <div class="time-box"><span class="time-val" id="mins">00</span><span class="time-label">Mins</span></div>
            <div class="time-box"><span class="time-val" id="secs">00</span><span class="time-label">Secs</span></div>
        </div>

        <div id="surprise-zone" class="gift-container" onclick="checkLock()">
            <div class="gift-box">🎁</div>
            <div class="open-btn" id="gift-text">Still Locked 🔒</div>
        </div>

        <div id="secret-message">
            <div class="english-touch">I Love You So Much ❤️</div>
            <div id="text-body" class="typing-container"></div>
            <div id="special-ending" class="final-wish">كل سنة وانتي ناجحة ومحققة كل اللي بتتمنيه.. كل سنة وانتي جودي اللي مفيش منها اتنين.. ربنا يخليكي ليا ويديمك في حياتي العمر كله يا اغلى من عندي 💖✨</div>
            <div id="wish-box">
                <p style="font-family: 'Dancing Script', cursive; font-size: 2.4rem; color: var(--secondary-color);">Make a Special Wish</p>
                <form id="wish-form">
                    <input type="text" id="wish-input" name="wish" placeholder="Write your secret wish here..." required>
                    <br>
                    <button type="submit" class="main-btn">Sent to Stars ✨</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("April 17, 2026 00:00:00").getTime();
        let isLocked = true;

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days < 10 ? "0"+days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0"+hours : hours;
            document.getElementById("mins").innerHTML = minutes < 10 ? "0"+minutes : minutes;
            document.getElementById("secs").innerHTML = seconds < 10 ? "0"+seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                isLocked = false;
                document.getElementById("countdown").innerHTML = "<h2 style='color:var(--primary-color); font-family:Dancing Script'>It's Time! ✨</h2>";
                document.getElementById("gift-text").innerHTML = "Open My Heart ❤️";
                document.getElementById("gift-text").classList.add("unlocked-btn");
                document.getElementById("status-label").innerHTML = "The magic is ready...";
            }
        }, 1000);

        function checkLock() {
            if (isLocked) {
                const zone = document.getElementById("surprise-zone");
                zone.classList.add("shake");
                setTimeout(() => zone.classList.remove("shake"), 400);
                alert("Not yet, princess! Be patient for the magic... ✨");
            } else {
                startMagic();
            }
        }

        const bgMusic = document.getElementById("bgMusic");
        const mainMusic = document.getElementById("mainMusic");
        let bgStarted = false;

        function startBackgroundMusic() {
            if (!bgStarted) { bgMusic.volume = 0.2; bgMusic.play(); bgStarted = true; }
        }

        let textIndex = 0;
        const fullText = `النهاردة مش مجرد يوم عادي في السنة.. النهاردة اليوم اللي وش الدنيا ضحك فيه عشان انتي نورتيها.. كل سنة وانتي اطيب واحن قلب عرفته في حياتي.. كل سنة وانتي الضحكة اللي بتطلع من القلب بجد والونس اللي مالي عليا دنيتي .

عارفة.. انا ساعات بسرح وبقول لو مكنتيش موجودة كان زمان ايامي شكلها عامل ازاي.. وجودك جنبي هو اللي بيحلّي اي حاجة صعبة بعدي بيها.. انتي مش بس حبيبتي انتي السند اللي برمي عليه همي وبلاقي الدنيا هديت لمجرد اني اتكلمت معاكي.. وجودك في حياتي ده رزق كبير اوي وبشكر ربنا عليه كل يوم .

لو قعدت اكتب من هنا للسنة الجاية مش هعرف اوصفلك انتي غالية عندي قد ايه.. انتي التفصيلة الحلوة اللي في يومي.. اللي بستنى اكلمها عشان افصل من التعب والضغط.. انتي الشخص الوحيد اللي بفهمني من غير ما اتكلم وبلاقي نفسي معاكي على طبيعتي من غير تمثيل ولا تجميل .

وعن وجودك.. ف وجودك هو الامان هو الراحة.. بحس ان الدنيا لسه بخير طول ما انتي في ضهري ومعايا.. كلامك بيشجعني وتفكيرك بيخليني دايما عايز اكون احسن عشانك وعشان نكبر سوا ونحقق كل اللي بنحلم بيه.. انتي بجد اجمل حاجة حصلتلي من سنين .

وعن بكرة.. ف بكرة ده يوم عالمي بالنسبالي.. يوم ميلاد القمر اللي منورلي حياتي.. عايزك في اليوم ده تنسي اي زعل وتفرحي من قلبك لأنك تستاهلي كل حاجة حلوة في الدنيا.. وعايزك تعرفي ان فرحتك في اليوم ده هي فرحتي انا كمان .

وعن وعدي ليكي.. ف انا بوعدك قدام نفسي وقدام الدنيا كلها اني هفضل جنبك ومش هسيبك ابدا.. هفضل السند والضهر اللي تتسندي عليه وانتي مطمنة.. هفضل دايما بحاول افرحك واشوف الضحكة على وشك لأن دي مهمتي الاساسية.. هنكبر سوا ونعدي اي صعب سوا وهنفضل دايما ايد واحدة .`;

        function startMagic() {
            bgMusic.volume = 0.05; mainMusic.play();
            document.getElementById("countdown").style.display = "none";
            document.getElementById("surprise-zone").style.display = "none";
            document.getElementById("status-label").style.display = "none";
            document.getElementById("secret-message").style.display = "block";
            for(let i=0; i<30; i++) { createParticle('❤️'); createParticle('✨'); }
            typeText();
        }

        function typeText() {
            if (textIndex < fullText.length) {
                document.getElementById("text-body").innerHTML += fullText.charAt(textIndex);
                textIndex++; setTimeout(typeText, 45);
            } else {
                document.getElementById("special-ending").style.display = "block";
                document.getElementById("wish-box").style.display = "block";
            }
        }

        function createParticle(symbol) {
            const p = document.createElement('div');
            p.innerHTML = symbol; p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = '20px';
            p.style.transition = `all ${Math.random() * 3 + 4}s linear`;
            document.body.appendChild(p);
            setTimeout(() => { p.style.top = '110vh'; }, 10);
            setTimeout(() => { p.remove(); }, 6000);
        }

        const form = document.getElementById("wish-form");
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            fetch("https://formspree.io/f/meevaelk", {
                method: "POST",
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(() => {
                document.getElementById("wish-box").innerHTML = `<p style="font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: var(--primary-color);">Sent to the stars! ❤️</p>`;
            });
        });
    </script>
</body>
</html>
